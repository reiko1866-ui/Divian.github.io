<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interaktív Mesemondó — választásos mese ElevenLabs vagy böngésző hanggal." />
  <title>Interaktív Mesemondó</title>
  <style>
:root {
  --bg-color: #fefae0;
  --card-bg: #ffffff;
  --primary: #dda15e;
  --primary-hover: #bc6c25;
  --text: #283618;
  --accent: #606c38;
  --accent-hover: #4a542b;
  --panel: #f1f3e9;
}

* {
  box-sizing: border-box;
}

body {
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background-color: var(--bg-color);
  color: var(--text);
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.container {
  max-width: 680px;
  width: 100%;
  background: var(--card-bg);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
}

h1 {
  text-align: center;
  color: var(--accent);
  margin: 0 0 20px;
}

.settings-panel,
.setup-panel {
  background: var(--panel);
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 25px;
  font-size: 0.9em;
}

.settings-panel label,
.setup-panel > label {
  font-weight: bold;
  display: block;
  margin-bottom: 8px;
}

.settings-panel select,
.settings-panel input,
.setup-panel textarea,
.setup-panel select,
.setup-panel input {
  width: 100%;
  padding: 8px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font: inherit;
  color: var(--text);
  background: #fff;
}

.setup-panel textarea {
  resize: vertical;
  min-height: 4.5rem;
  font-size: 1rem;
}

.setup-row {
  display: grid;
  gap: 10px;
  margin-bottom: 8px;
}

@media (min-width: 560px) {
  .setup-row {
    grid-template-columns: 1fr 1fr;
  }
}

.inline {
  display: grid;
  gap: 6px;
  font-weight: bold;
}

.chapter-label {
  margin: 0;
  font-size: 0.85em;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--primary-hover);
}

.story-title {
  margin: 4px 0 12px;
  color: var(--accent);
  font-size: 1.35em;
}

.story-box {
  font-size: 1.25em;
  line-height: 1.6;
  background: #fafafa;
  padding: 20px;
  border-left: 5px solid var(--primary);
  border-radius: 8px;
  margin-bottom: 20px;
  min-height: 100px;
  white-space: pre-wrap;
}

.audio-controls,
.footer-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 25px;
}

.footer-actions {
  margin-top: 18px;
  margin-bottom: 0;
}

button {
  background-color: var(--primary);
  color: white;
  border: none;
  padding: 12px 20px;
  font-size: 1em;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  font: inherit;
}

button:hover {
  background-color: var(--primary-hover);
}

button:active {
  transform: scale(0.98);
}

.secondary-btn {
  background-color: var(--accent);
}

.secondary-btn:hover {
  background-color: var(--accent-hover);
}

.choices {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.choice-btn {
  background-color: var(--accent);
  text-align: left;
}

.choice-btn:hover {
  background-color: var(--accent-hover);
}

.hidden {
  display: none !important;
}

</style>
</head>

        <option value="elevenlabs">ElevenLabs AI Hang (Prémium API)</option>

      <div id="elevenlabs-inputs" class="hidden">

    </div>

    <section id="setup-panel" class="setup-panel">
      <label for="disney-select">Disney mese kiválasztása:</label>
      <select id="disney-select">
        <option value="">— Válassz Disney mesét (összes) —</option>
      </select>

      <label for="wish-input">Vagy írd le, mit szeretnél (opcionális):</label>
      <textarea id="wish-input" rows="2" maxlength="400" placeholder="Pl. a báljelenet, a jégpalota, a kívánságok…"></textarea>

      <div class="setup-row">
        <label class="inline">
          Hangulat

            <option value="vidam">Vidám</option>
            <option value="kalandos">Kalandos</option>

          </select>
        </label>
        <label class="inline">
          Hős neve
          <input type="text" id="hero-name" maxlength="40" placeholder="opcionális" />
        </label>
      </div>

      <div class="audio-controls">
        <button type="button" id="btn-start">Induljon a mese</button>
        <button type="button" id="btn-surprise" class="secondary-btn">Véletlen Disney mese</button>
      </div>
    </section>

    <section id="story-panel" class="hidden">
      <p class="chapter-label" id="chapter-label">1. fejezet</p>
      <h2 class="story-title" id="story-title">A te meséd</h2>
      <div id="story-text" class="story-box">Töltés...</div>

      <div class="audio-controls">
        <button type="button" id="btn-speak">🔊 Újraolvasás</button>
        <button type="button" id="btn-stop">⏹️ Leállítás</button>
        <button type="button" id="btn-new" class="secondary-btn">Új mese</button>
      </div>

      <div id="choices-container" class="choices"></div>

      <div class="footer-actions">
        <button type="button" id="btn-download" class="secondary-btn">Mese mentése</button>
        <button type="button" id="btn-finish" class="secondary-btn">Mesét lezárom mára</button>
      </div>
    </section>
  </div>

    return `Ma este a(z) ${world.disneyTitle} világa nyílt meg előttünk.

Réges-régen — ${world.openingHook} — kezdődött ${story.hero} saját kalandja. ${story.place} már akkor is tele volt ${story.mood.light}, amikor kimondta a kívánságát: ${story.wish}.

Mellé szegődött ${story.companion}. Együtt meglátták ${story.wonder} ragyogását… és messzebb ${story.threat} árnyékát is. ${comp} megszorította ${story.hero} kezét:

„Ez a te ${world.disneyTitle}-meséd. Ismerős világ, új hős, végtelen fejezet.”

Az első felvonás kapuja kitárult.`;
  }

  function createScene(story, beat, isOpening) {
    const id = "ch-" + story.chapterNum + "-" + beat + "-" + Math.floor(Math.random() * 1e6);
    return {
      id,
      chapter: story.chapterNum + ". fejezet",
      beat,
      text: isOpening ? openingText(story) : chapterText(story, beat),
      choices: makeChoices(),
      ending: false,
    };
  }

  function buildStory(opts) {
    const wish = (opts.wish || "").trim() || randomWish();
    const world = detectWorld(wish, opts.disneyId);
    const moodKey = opts.mood || pick(["vidam", "kalandos", "mesés"]);
    const story = {
      title: pick(world.titleBits),
      disneyTitle: world.disneyTitle,
      hero: (opts.heroName || "").trim() || pick(HEROES),
      companion: pick(world.companions),
      worldId: world.id,
      wish,
      moodKey,
      mood: moodFlavor(moodKey),
      place: pick(world.places),
      wonder: pick(world.wonders),
      threat: pick(world.threats),
      chapterNum: 1,
      recentBeats: ["iconic"],
      scenes: {},
      currentId: null,
      log: [],
      finished: false,
    };
    const scene = createScene(story, "iconic", true);
    story.scenes[scene.id] = scene;
    story.currentId = scene.id;
    return story;
  }

  function getScene(story) {
    return story.scenes[story.currentId];
  }

  function choose(story, action) {
    if (story.finished) return getScene(story);
    const current = getScene(story);
    story.log.push({ chapter: current.chapter, text: current.text, choiceTo: action });
    if (action === "__end__") return finishStory(story);

    story.chapterNum += 1;
    maybeShiftSetting(story);
    const beat = pickBeat(story, action);
    story.recentBeats = (story.recentBeats || []).concat([beat]).slice(-4);
    const scene = createScene(story, beat, false);
    story.scenes[scene.id] = scene;
    story.currentId = scene.id;
    return scene;
  }

  function finishStory(story) {
    const current = getScene(story);
    if (!story.log.length || story.log[story.log.length - 1].text !== current.text) {
      story.log.push({ chapter: current.chapter, text: current.text, choiceTo: "__end__" });
    }
    const id = "ending-" + Date.now();
    const comp = story.companion.replace(/^egy /, "");
    const scene = {
      id,
      chapter: "Pihenő a stáblista előtt",
      text: `${story.hero} és ${comp} megálltak a(z) ${story.disneyTitle} világában, ${story.place}. ${story.wonder} még ragyogott, ${story.threat} pedig nem tűnt el örökre — csak várta a következő felvonást.

A stáblista helyett most csendet kérünk. Ha újra kívánod, bármelyik Disney-mese kapuja kinyílik.

Itt a (mai) vége, fuss el véle.`,
      choices: [],
      ending: true,
    };
    story.scenes[id] = scene;
    story.currentId = id;
    story.finished = true;
    return scene;
  }

  function fullTranscript(story) {
    const parts = story.log.map((e) => `${e.chapter}\n${e.text}`);
    const last = getScene(story);
    const block = `${last.chapter}\n${last.text}`;
    if (!parts.length || parts[parts.length - 1] !== block) parts.push(block);
    return `${story.title}\n(${story.disneyTitle})\n\n${parts.join("\n\n")}\n`;
  }

  global.MeseEngine = {
    WORLDS,
    DISNEY_FILMS,
    SURPRISES: DISNEY_FILMS.map((f) => f.title + " stílusú kaland"),
    listDisneyFilms,
    randomWish,
    buildStory,
    getScene,
    choose,
    finishStory,
    fullTranscript,
    pick,
  };
})(window);

</script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const engineSelect = $("engine-select");
  const elevenInputs = $("elevenlabs-inputs");
  const apiKeyInput = $("api-key");
  const voiceIdInput = $("voice-id");
  const setupPanel = $("setup-panel");
  const storyPanel = $("story-panel");
  const wishInput = $("wish-input");
  const disneySelect = $("disney-select");
  const moodSelect = $("mood-select");
  const heroNameInput = $("hero-name");
  const chapterLabel = $("chapter-label");
  const storyTitle = $("story-title");
  const storyText = $("story-text");
  const choicesContainer = $("choices-container");
  const btnStart = $("btn-start");
  const btnSurprise = $("btn-surprise");
  const btnSpeak = $("btn-speak");
  const btnStop = $("btn-stop");
  const btnNew = $("btn-new");
  const btnDownload = $("btn-download");
  const btnFinish = $("btn-finish");

  const STORAGE_ENGINE = "mesemondo-engine";
  const STORAGE_KEY = "mesemondo-eleven-key";
  const STORAGE_VOICE = "mesemondo-eleven-voice";
  const DEFAULT_VOICE = "pNInz6obpgDQGcFmaJgB"; // Adam — férfi mesélő (NE Rachel/női!)

  let story = null;
  let currentAudioObject = null;
  let activeAudioUrl = null;
  let cachedMaleVoice = null;

  function isFemaleVoiceName(name) {
    const n = (name || "").toLowerCase();
    return /női|noi|female|woman|girl|noémi|noemi|szilvia|susan|zira|samantha|rachel|sarah|domi|bella|elli|emily|aria/.test(n);
  }

  function isMaleVoiceName(name) {
    const n = (name || "").toLowerCase();
    return /férfi|ferfi|male|man|tamás|tamas|szabolcs|bálint|balint|istván|istvan|lászló|laszlo|adam|arnold|josh|antoni|daniel|david/.test(n);
  }

  function pickMaleHuVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    const hu = voices.filter((v) => (v.lang || "").toLowerCase().startsWith("hu"));
    const maleHu = hu.filter((v) => isMaleVoiceName(v.name) && !isFemaleVoiceName(v.name));
    if (maleHu.length) return maleHu[0];
    // Ha van Tamás / Szabolcs a névben
    const named = hu.find((v) => /tamás|tamas|szabolcs/i.test(v.name));
    if (named) return named;
    // Kerüljük a női hangokat
    const nonFemale = hu.find((v) => !isFemaleVoiceName(v.name));
    return nonFemale || null;
  }

  function loadSettings() {
    try {
      engineSelect.value = localStorage.getItem(STORAGE_ENGINE) || "native";
      apiKeyInput.value = localStorage.getItem(STORAGE_KEY) || "";
      const savedVoice = localStorage.getItem(STORAGE_VOICE) || DEFAULT_VOICE;
      // Ha valaki korábban női Rachel ID-t mentett, cseréljük férfira
      const femaleIds = ["21m00Tcm4TlvDq8ikWAM", "EXAVITQu4vr4xnSDxMaL", "MF3mGyEYCl7XYWbV9V6O"];
      voiceIdInput.value = femaleIds.includes(savedVoice) ? DEFAULT_VOICE : savedVoice;
    } catch (_) {
      voiceIdInput.value = DEFAULT_VOICE;
    }
    toggleEngineSettings();
  }

  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_ENGINE, engineSelect.value);
      localStorage.setItem(STORAGE_KEY, apiKeyInput.value.trim());
      localStorage.setItem(STORAGE_VOICE, voiceIdInput.value.trim() || DEFAULT_VOICE);
    } catch (_) {
      /* ignore */
    }
  }

  function toggleEngineSettings() {
    if (engineSelect.value === "elevenlabs") {
      elevenInputs.classList.remove("hidden");
    } else {
      elevenInputs.classList.add("hidden");
    }
    saveSettings();
  }

  function showSetup() {
    stopAudio();
    story = null;
    setupPanel.classList.remove("hidden");
    storyPanel.classList.add("hidden");
  }

  function showStory() {
    setupPanel.classList.add("hidden");
    storyPanel.classList.remove("hidden");
  }

  function renderScene() {
    if (!story) return;
    const scene = MeseEngine.getScene(story);
    chapterLabel.textContent = scene.chapter;
    storyTitle.textContent = story.title;
    storyText.innerText = scene.text;

    choicesContainer.innerHTML = "";

    if (scene.ending || story.finished) {
      const restart = document.createElement("button");
      restart.className = "choice-btn";
      restart.innerText = "🔄 Új mese";
      restart.onclick = showSetup;
      choicesContainer.appendChild(restart);

      const cont = document.createElement("button");
      cont.className = "choice-btn";
      cont.innerText = "➡️ Mégis folytatom";
      cont.onclick = () => {
        story.finished = false;
        MeseEngine.choose(story, "curious");
        renderScene();
      };
      choicesContainer.appendChild(cont);
    } else {
      scene.choices.forEach((choice) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerText = choice.label;
        btn.onclick = () => {
          stopAudio();
          MeseEngine.choose(story, choice.next);
          renderScene();
        };
        choicesContainer.appendChild(btn);
      });
    }

    speakCurrentStory();
  }

  function populateDisneySelect() {
    if (!disneySelect || !MeseEngine.listDisneyFilms) return;
    const films = MeseEngine.listDisneyFilms();
    films.forEach((film) => {
      const opt = document.createElement("option");
      opt.value = film.id;
      opt.textContent = film.label;
      disneySelect.appendChild(opt);
    });
  }

  function startStory(wish, disneyId) {
    const selectedId = disneyId || (disneySelect && disneySelect.value) || "";
    let cleaned = (wish || "").trim();
    if (!cleaned && selectedId && MeseEngine.WORLDS[selectedId]) {
      cleaned = MeseEngine.WORLDS[selectedId].disneyTitle + " stílusú kaland";
    }
    cleaned = cleaned || MeseEngine.randomWish();
    wishInput.value = cleaned;
    story = MeseEngine.buildStory({
      wish: cleaned,
      mood: moodSelect.value,
      heroName: heroNameInput.value,
      disneyId: selectedId || undefined,
    });
    showStory();
    renderScene();
  }

  // Felolvasó logika (routing) — a megadott minta szerint
  function speakCurrentStory() {
    if (!story) return;
    stopAudio();
    const text = MeseEngine.getScene(story).text;
    const engine = engineSelect.value;

    if (engine === "elevenlabs") {
      const apiKey = apiKeyInput.value.trim();
      const voiceId = voiceIdInput.value.trim() || DEFAULT_VOICE;

      if (!apiKey || !voiceId) {
        alert("Kérlek add meg az ElevenLabs API kulcsot és a Voice ID-t!");
        return;
      }
      saveSettings();
      speakElevenLabs(text, apiKey, voiceId);
    } else {
      speakNative(text);
    }
  }

  function speakNative(text) {
    if (!("speechSynthesis" in window)) return;

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "hu-HU";
    utterance.rate = 0.88; // Nyugodt mesélős tempó
    // Férfi mesélő: kissé mélyebb hangszín, ne nőies pitch
    utterance.pitch = 0.9;

    cachedMaleVoice = pickMaleHuVoice() || cachedMaleVoice;
    if (cachedMaleVoice) {
      utterance.voice = cachedMaleVoice;
    } else {
      // Ha csak női magyar hang van, ne emeljük a pitch-et — inkább mélyítsük
      utterance.pitch = 0.75;
    }

    window.speechSynthesis.speak(utterance);
  }

  async function speakElevenLabs(text, apiKey, voiceId) {
    try {
      const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
        method: "POST",
        headers: {
          Accept: "audio/mpeg",
          "Content-Type": "application/json",
          "xi-api-key": apiKey,
        },
        body: JSON.stringify({
          text: text,
          model_id: "eleven_multilingual_v2",
          voice_settings: {
            stability: 0.35,
            similarity_boost: 0.8,
            style: 0.15,
          },
        }),
      });

      if (!response.ok) throw new Error(`HTTP hiba: ${response.status}`);

      const audioBlob = await response.blob();
      if (activeAudioUrl) URL.revokeObjectURL(activeAudioUrl);
      const audioUrl = URL.createObjectURL(audioBlob);
      activeAudioUrl = audioUrl;

      currentAudioObject = new Audio(audioUrl);
      currentAudioObject.play();
    } catch (err) {
      console.error("ElevenLabs hiba, visszatérés a beépített hangra:", err);
      speakNative(text);
    }
  }

  function stopAudio() {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    if (currentAudioObject) {
      currentAudioObject.pause();
      currentAudioObject = null;
    }
    if (activeAudioUrl) {
      URL.revokeObjectURL(activeAudioUrl);
      activeAudioUrl = null;
    }
  }

  function downloadStory() {
    if (!story) return;
    const text = MeseEngine.fullTranscript(story);
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${story.title.replace(/\s+/g, "_")}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  engineSelect.addEventListener("change", toggleEngineSettings);
  apiKeyInput.addEventListener("change", saveSettings);
  voiceIdInput.addEventListener("change", saveSettings);

  btnStart.addEventListener("click", () => startStory(wishInput.value));
  btnSurprise.addEventListener("click", () => {
    const films = MeseEngine.listDisneyFilms();
    const film = films[Math.floor(Math.random() * films.length)];
    if (disneySelect) disneySelect.value = film.id;
    startStory(film.title + " stílusú kaland", film.id);
  });
  if (disneySelect) {
    disneySelect.addEventListener("change", () => {
      if (!disneySelect.value) return;
      const world = MeseEngine.WORLDS[disneySelect.value];
      if (world) wishInput.value = world.disneyTitle + " stílusú kaland";
    });
  }
  btnSpeak.addEventListener("click", speakCurrentStory);
  btnStop.addEventListener("click", stopAudio);
  btnNew.addEventListener("click", showSetup);
  btnDownload.addEventListener("click", downloadStory);
  btnFinish.addEventListener("click", () => {
    if (!story || story.finished) return;
    stopAudio();
    MeseEngine.finishStory(story);
    renderScene();
  });

  // Indítás
  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      cachedMaleVoice = pickMaleHuVoice();
    };
    cachedMaleVoice = pickMaleHuVoice();
  }
  loadSettings();
  populateDisneySelect();
  showSetup();
})();

</script>
</body>
</html>
