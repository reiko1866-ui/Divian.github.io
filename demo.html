<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Divi — interaktív beszélő animációs karakter. Kérdez, felel, játszik veled." />
  <title>Divi — Beszélő barát</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --sky-top: #7ec8e3;
  --sky-bottom: #c8e7f5;
  --floor: #8fbc8f;
  --ink: #1d3557;
  --foam: #fff8f0;
  --accent: #e76f51;
  --accent-deep: #d62828;
  --mint: #2a9d8f;
  --mint-deep: #1f7a6f;
  --bubble: #ffffff;
  --shadow: rgba(29, 53, 87, 0.14);
  --font-display: "Fredoka", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 55%, var(--floor));
  min-height: 100vh;
  min-height: 100dvh;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  position: relative;
  overflow: hidden;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 8px;
  z-index: 5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  font-size: 1.6rem;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.08));
}

.brand h1 {
  font-family: var(--font-display);
  font-size: 1.7rem;
  margin: 0;
  line-height: 1;
  letter-spacing: 0.02em;
}

.tagline {
  margin: 2px 0 0;
  font-size: 0.82rem;
  opacity: 0.75;
}

.icon-btn {
  border: none;
  background: rgba(255, 255, 255, 0.7);
  width: 42px;
  height: 42px;
  border-radius: 14px;
  font-size: 1.2rem;
  cursor: pointer;
  box-shadow: 0 4px 12px var(--shadow);
}

.settings-drawer {
  position: absolute;
  inset: 12px 12px auto;
  z-index: 20;
  background: var(--foam);
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
  display: grid;
  gap: 8px;
}

.settings-drawer h2 {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-size: 1.2rem;
}

.settings-drawer label {
  font-weight: 700;
  font-size: 0.85rem;
}

.settings-drawer select,
.settings-drawer input[type="password"],
.settings-drawer input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid rgba(29, 53, 87, 0.12);
  border-radius: 12px;
  font: inherit;
  background: #fff;
  color: var(--ink);
}

.toggle-row {
  display: flex !important;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  cursor: pointer;
}

.hint {
  margin: 4px 0 0;
  font-size: 0.8rem;
  line-height: 1.35;
  font-weight: 600;
  opacity: 0.8;
}

.primary-btn {
  margin-top: 6px;
  border: none;
  background: var(--mint);
  color: #fff;
  font: inherit;
  font-weight: 700;
  padding: 12px 16px;
  border-radius: 14px;
  cursor: pointer;
}

.primary-btn:hover {
  background: var(--mint-deep);
}

.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 16px 0;
  min-height: 0;
}

.room {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.55), transparent 28%),
    radial-gradient(circle at 80% 12%, rgba(255, 220, 150, 0.35), transparent 26%),
    linear-gradient(180deg, transparent 62%, rgba(70, 120, 70, 0.25) 62%, rgba(70, 120, 70, 0.4));
}

.speech-bubble {
  position: relative;
  z-index: 3;
  max-width: min(90%, 340px);
  margin-bottom: 8px;
  background: var(--bubble);
  color: var(--ink);
  padding: 12px 16px;
  border-radius: 18px;
  box-shadow: 0 8px 24px var(--shadow);
  animation: bubble-in 0.35s ease;
}

.speech-bubble::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -10px;
  transform: translateX(-50%);
  border: 10px solid transparent;
  border-top-color: var(--bubble);
}

.speech-bubble p {
  margin: 0;
  font-size: 1.05rem;
  line-height: 1.35;
  font-weight: 700;
}

.character-wrap {
  position: relative;
  z-index: 2;
  border: none;
  background: transparent;
  padding: 0;
  cursor: pointer;
  width: min(78vw, 320px);
  outline: none;
}

.character {
  width: 100%;
  height: auto;
  overflow: visible;
  filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.12));
}

.tap-hint {
  display: block;
  margin-top: -6px;
  font-family: var(--font-display);
  font-size: 0.9rem;
  opacity: 0.65;
}

.status-line {
  z-index: 2;
  margin: 10px 0 0;
  font-size: 0.92rem;
  font-weight: 700;
  opacity: 0.8;
  text-align: center;
  min-height: 1.3em;
}

/* Character animation states */
.character .body,
.character .head {
  transform-origin: 140px 230px;
  transform-box: fill-box;
}

.character.state-idle .body {
  animation: breathe 3.2s ease-in-out infinite;
}

.character.state-idle .head {
  animation: sway 4s ease-in-out infinite;
}

.character.state-idle .blink-lid {
  animation: blink 4.8s infinite;
}

.character.state-listening .ear-left {
  animation: ear-twitch 0.7s ease-in-out infinite;
}

.character.state-listening .ear-right {
  animation: ear-twitch 0.7s ease-in-out infinite reverse;
}

.character.state-listening .pupil {
  animation: look-around 2.4s ease-in-out infinite;
}

.character.state-thinking .head {
  animation: think-tilt 1.2s ease-in-out infinite;
}

.character.state-speaking .mouth-closed {
  opacity: 0;
}

.character.state-speaking .mouth-open,
.character.state-speaking .mouth-tongue {
  opacity: 1;
  animation: talk 0.22s ease-in-out infinite alternate;
}

.character.state-speaking .arm-left {
  animation: wave-left 0.8s ease-in-out infinite;
}

.character.state-speaking .arm-right {
  animation: wave-right 0.8s ease-in-out infinite;
}

.character.state-react .body {
  animation: bounce 0.55s ease;
}

.character.state-react .head {
  animation: bounce-head 0.55s ease;
}

.character.state-laugh .mouth-closed {
  opacity: 0;
}

.character.state-laugh .mouth-open,
.character.state-laugh .mouth-tongue {
  opacity: 1;
}

.character.state-laugh .body {
  animation: giggle 0.45s ease-in-out 3;
}

@keyframes breathe {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  50% { transform: translateY(-4px) scale(1.02, 0.98); }
}

@keyframes sway {
  0%, 100% { transform: rotate(-1.5deg); }
  50% { transform: rotate(1.5deg); }
}

@keyframes blink {
  0%, 92%, 100% { opacity: 0; }
  94%, 96% { opacity: 1; }
}

@keyframes ear-twitch {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-8deg); }
}

@keyframes look-around {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(3px, -1px); }
  75% { transform: translate(-3px, 1px); }
}

@keyframes think-tilt {
  0%, 100% { transform: rotate(-4deg) translateY(0); }
  50% { transform: rotate(4deg) translateY(-3px); }
}

@keyframes talk {
  from { transform: scaleY(0.55); }
  to { transform: scaleY(1.05); }
}

@keyframes wave-left {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-12deg); }
}

@keyframes wave-right {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(12deg); }
}

@keyframes bounce {
  0% { transform: translateY(0) scale(1); }
  35% { transform: translateY(-28px) scale(1.04, 0.96); }
  70% { transform: translateY(4px) scale(0.98, 1.03); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes bounce-head {
  0% { transform: translateY(0); }
  35% { transform: translateY(-10px) rotate(-4deg); }
  100% { transform: translateY(0); }
}

@keyframes giggle {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-3deg) scale(1.02); }
  75% { transform: rotate(3deg) scale(1.02); }
}

@keyframes bubble-in {
  from { opacity: 0; transform: translateY(8px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.chat-dock {
  z-index: 5;
  background: linear-gradient(180deg, rgba(255, 248, 240, 0.55), var(--foam) 28%);
  border-radius: 24px 24px 0 0;
  padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
  box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.08);
}

.chat-log {
  max-height: 120px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
  padding: 4px 2px;
}

.chat-msg {
  max-width: 88%;
  padding: 8px 12px;
  border-radius: 14px;
  font-size: 0.92rem;
  line-height: 1.35;
  font-weight: 600;
  animation: bubble-in 0.25s ease;
}

.chat-msg.bot {
  align-self: flex-start;
  background: #fff;
  box-shadow: 0 2px 8px var(--shadow);
}

.chat-msg.user {
  align-self: flex-end;
  background: #ffe0c2;
}

.chat-form {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px;
  align-items: center;
}

.mic-btn,
.send-btn {
  border: none;
  cursor: pointer;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  font-size: 1.35rem;
}

.mic-btn {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 8px 18px rgba(231, 111, 81, 0.35);
}

.mic-btn.listening {
  background: var(--accent-deep);
  animation: pulse-mic 1s ease-in-out infinite;
}

.mic-wave {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid rgba(231, 111, 81, 0.45);
  opacity: 0;
}

.mic-btn.listening .mic-wave {
  animation: ripple 1s ease-out infinite;
}

.send-btn {
  background: var(--mint);
  color: #fff;
  font-size: 1.1rem;
}

#user-input {
  width: 100%;
  border: 2px solid rgba(29, 53, 87, 0.1);
  border-radius: 999px;
  padding: 12px 16px;
  font: inherit;
  font-weight: 600;
  background: #fff;
  color: var(--ink);
}

.quick-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.chip {
  border: none;
  background: rgba(42, 157, 143, 0.14);
  color: var(--mint-deep);
  font: inherit;
  font-weight: 700;
  font-size: 0.85rem;
  padding: 8px 12px;
  border-radius: 999px;
  cursor: pointer;
}

.chip:hover {
  background: rgba(42, 157, 143, 0.24);
}

@keyframes pulse-mic {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

@keyframes ripple {
  from { transform: scale(0.9); opacity: 0.8; }
  to { transform: scale(1.35); opacity: 0; }
}

.hidden {
  display: none !important;
}

@media (min-height: 780px) {
  .chat-log {
    max-height: 160px;
  }

  .character-wrap {
    width: min(78vw, 360px);
  }
}

  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🦊</span>
        <div>
          <h1>Divi</h1>
          <p class="tagline">Beszélő barátod</p>
        </div>
      </div>
      <button type="button" id="btn-settings" class="icon-btn" aria-label="Beállítások" title="Beállítások">⚙️</button>
    </header>

    <aside id="settings-panel" class="settings-drawer hidden" aria-label="Beállítások">
      <h2>Beállítások</h2>
      <label for="engine-select">Hang motor</label>
      <select id="engine-select">
        <option value="native">Böngésző hang (ingyenes)</option>
        <option value="elevenlabs">ElevenLabs (API)</option>
      </select>

      <div id="elevenlabs-inputs" class="hidden">
        <label for="api-key">ElevenLabs API kulcs</label>
        <input type="password" id="api-key" autocomplete="off" placeholder="sk-…" />
        <label for="voice-id">Férfi Voice ID</label>
        <select id="voice-id">
          <option value="pNInz6obpgDQGcFmaJgB" selected>Adam</option>
          <option value="VR6AewLTigWG4xSOukaG">Arnold</option>
          <option value="TxGEqnHWrfWFTfGW9XjX">Josh</option>
          <option value="ErXwobaYiN019PkySvjV">Antoni</option>
        </select>
      </div>

      <label for="openai-key">OpenAI kulcs (opcionális, okosabb AI)</label>
      <input type="password" id="openai-key" autocomplete="off" placeholder="sk-… üresen is megy" />

      <label class="toggle-row" for="echo-mode">
        <input type="checkbox" id="echo-mode" />
        Vicces visszhang mód (mint Talking Tom)
      </label>

      <label class="toggle-row" for="auto-listen">
        <input type="checkbox" id="auto-listen" checked />
        Válasz után újra hallgat
      </label>

      <p class="hint" id="mic-help">
        Mikrofon: Chrome vagy Edge ajánlott, HTTPS-en (GitHub Pages).
        Ha az előnézetben (htmlpreview) nem megy, nyisd meg a saját Pages URL-t.
        Engedély: címsor 🔒 → Mikrofon → Engedélyezés.
      </p>

      <button type="button" id="btn-close-settings" class="primary-btn">Kész</button>
    </aside>

    <main class="stage">
      <div class="room" aria-hidden="true"></div>

      <div id="speech-bubble" class="speech-bubble hidden" role="status" aria-live="polite">
        <p id="bubble-text"></p>
      </div>

      <button type="button" id="character-hitbox" class="character-wrap" aria-label="Koppints Divire">
        <svg id="character" class="character state-idle" viewBox="0 0 280 340" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f4a261" />
              <stop offset="100%" stop-color="#e76f51" />
            </linearGradient>
            <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff3e0" />
              <stop offset="100%" stop-color="#ffe0b2" />
            </linearGradient>
          </defs>

          <!-- shadow -->
          <ellipse class="shadow" cx="140" cy="318" rx="70" ry="12" fill="rgba(40,30,20,0.18)" />

          <!-- body -->
          <g class="body">
            <ellipse cx="140" cy="230" rx="78" ry="88" fill="url(#fur)" />
            <ellipse cx="140" cy="238" rx="48" ry="58" fill="url(#belly)" />

            <!-- arms -->
            <g class="arm arm-left">
              <ellipse cx="62" cy="220" rx="22" ry="36" fill="#e76f51" transform="rotate(-18 62 220)" />
              <circle cx="48" cy="248" r="16" fill="#ffcc80" />
            </g>
            <g class="arm arm-right">
              <ellipse cx="218" cy="220" rx="22" ry="36" fill="#e76f51" transform="rotate(18 218 220)" />
              <circle cx="232" cy="248" r="16" fill="#ffcc80" />
            </g>

            <!-- legs -->
            <ellipse cx="108" cy="300" rx="24" ry="18" fill="#d62828" />
            <ellipse cx="172" cy="300" rx="24" ry="18" fill="#d62828" />
          </g>

          <!-- head -->
          <g class="head">
            <ellipse cx="140" cy="118" rx="86" ry="78" fill="url(#fur)" />
            <!-- ears -->
            <g class="ear ear-left">
              <polygon points="70,70 52,18 98,52" fill="#e76f51" />
              <polygon points="70,62 58,28 90,52" fill="#ffcc80" />
            </g>
            <g class="ear ear-right">
              <polygon points="210,70 228,18 182,52" fill="#e76f51" />
              <polygon points="210,62 222,28 190,52" fill="#ffcc80" />
            </g>
            <!-- muzzle -->
            <ellipse cx="140" cy="142" rx="42" ry="32" fill="#fff3e0" />

            <g class="eyes">
              <g class="eye eye-left">
                <ellipse cx="108" cy="108" rx="16" ry="18" fill="#fff" />
                <circle class="pupil" cx="110" cy="110" r="8" fill="#1d3557" />

              </g>
              <g class="eye eye-right">

                <circle class="pupil" cx="170" cy="110" r="8" fill="#1d3557" />
                <circle cx="173" cy="106" r="3" fill="#fff" />
              </g>
              <rect class="blink-lid lid-left" x="92" y="98" width="32" height="22" rx="10" fill="url(#fur)" opacity="0" />
              <rect class="blink-lid lid-right" x="156" y="98" width="32" height="22" rx="10" fill="url(#fur)" opacity="0" />
            </g>

              <path class="mouth-closed" d="M120 158 Q140 168 160 158" fill="none" stroke="#2b2d42" stroke-width="4" stroke-linecap="round" />
              <ellipse class="mouth-open" cx="140" cy="168" rx="18" ry="14" fill="#2b2d42" opacity="0" />
              <ellipse class="mouth-tongue" cx="140" cy="174" rx="10" ry="6" fill="#e63946" opacity="0" />

            <circle cx="202" cy="138" r="12" fill="#ff8a80" opacity="0.55" />

        </svg>
        <span class="tap-hint">Koppints rám!</span>
      </button>

      <p id="status-line" class="status-line">Nyomd meg a mikrofont, és beszélj Divihez</p>
    </main>

    <section class="chat-dock">
      <div id="chat-log" class="chat-log" aria-live="polite"></div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <button type="button" id="btn-mic" class="mic-btn" aria-label="Beszélj">
          <span class="mic-icon">🎤</span>
          <span class="mic-wave" aria-hidden="true"></span>

      <div class="quick-actions">

        <button type="button" class="chip" data-prompt="Mesélj valamit!">Mesélj</button>
        <button type="button" class="chip" data-prompt="Tegyél fel egy kérdést!">Kérdezz</button>
        <button type="button" class="chip" data-action="reset">Új beszélgetés</button>
      </div>
    </section>
  </div>

  <script>
/**
 * Divi beszélgető agy — kérdez–felel, helyi intelligencia + opcionális OpenAI
 */
(function (global) {
  const QUESTIONS = [
    "Mi a neved?",
    "Hány éves vagy?",
    "Mi a kedvenc állatod?",
    "Szeretsz mesét hallgatni?",
    "Mi a kedvenc színed?",
    "Mi volt ma a legjobb dolog, ami történt veled?",
    "Ha tudnál repülni, hová mennél?",
    "Mi a kedvenc ételed?",
    "Van testvéred vagy legjobb barátod?",
    "Milyen játékot szeretsz a legjobban?",
    "Mi szokott megnevettetni?",
    "Ha varázserőd lenne, mi lenne az?",
    "Szeretsz inkább bent vagy kint játszani?",
    "Mesélj egy álmodról!",
    "Ki a kedvenc mesefigurád?",
  ];

  const TOPIC_REPLIES = [
    {
      keys: [/szia|helló|hello|szevasz|hey/i],
      replies: [
        "Sziaaa! Örülök, hogy itt vagy! Hogy vagy ma?",
        "Helló, barátom! Készen állsz egy kis beszélgetésre?",
      ],
      followUp: "Miről szeretnél beszélgetni?",
    },
    {
      keys: [/hogy vagy|mizu|mi újság|mi ujsag/i],
      replies: [
        "Én remekül! Csóválom a farkam… várj, nincs is farkam, de hangulatban igen!",
        "Szuperul! Főleg ha veled csevegek.",
      ],
      followUp: "És te hogy érzed magad?",
    },
    {
      keys: [/nevem|hívnak|hivnak|én\s+\w+/i],
      replies: ["Örülök, hogy megismerhetlek!", "Szép név! Megjegyzem."],
      followUp: "Mi a kedvenc hobbid?",
    },
    {
      keys: [/mese|mesél|meselj|story/i],

      listening = false;
      startingMic = false;
      btnMic.classList.remove("listening");
      btnMic.setAttribute("aria-pressed", "false");
      if (!busy && character.state === "listening") character.setState("idle");
    };

    return rec;
  }

  async function startListening() {
    if (listening || startingMic) return;

    const blocked = micUnsupportedReason();
    if (blocked) {
      setStatus(blocked);
      showBubble(blocked);
      return;
    }

    // Ha Divi beszél / gondolkodik: szakítsuk meg, hogy a mic működjön
    if (busy) {
      stopSpeech();
      busy = false;
      character.setState("idle");
    } else {
      stopSpeech();
    }

    startingMic = true;
    btnMic.classList.add("listening");
    setStatus("Mikrofon indítása…");

    try {
      await ensureMicPermission();
    } catch (err) {
      startingMic = false;
      btnMic.classList.remove("listening");
      micPermission = "denied";
      const msg =
        "Nem kaptam mikrofon-engedélyt. A böngésző címsorában (🔒) engedd a mikrofont ehhez az oldalhoz, majd próbáld újra.";
      setStatus(msg);
      showBubble(msg);
      return;
    }

    const rec = recreateRecognition();
    if (!rec) {
      startingMic = false;
      btnMic.classList.remove("listening");
      setStatus(micUnsupportedReason() || "Beszédfelismerés nem elérhető.");
      return;
    }

    try {
      rec.start();
    } catch (err) {
      // Már fut — próbáljuk új példánnyal
      try {
        const again = recreateRecognition();
        if (again) again.start();
      } catch (err2) {
        startingMic = false;
        btnMic.classList.remove("listening");
        setStatus("Nem indult a mikrofon. Nyomd meg még egyszer.");
        console.warn(err2);
      }
    }
  }

  function toggleMic() {
    if (listening || startingMic) {
      stopListening();
      startingMic = false;
      character.setState("idle");
      setStatus("Megállítottam a hallgatást");
      return;
    }
    startListening();
  }

  async function bootGreeting() {
    if (greetingDone) return;
    greetingDone = true;
    const warn = micUnsupportedReason();
    if (warn) setStatus(warn);
    const g = brain.greeting();
    addChat("bot", g.text);
    await speak(g.text);
    // Auto-listen csak ha nem iframe/preview és van esély a micre
    if (autoListenInput.checked && !micUnsupportedReason() && micPermission !== "denied") {
      setTimeout(function () {
        startListening();
      }, 400);
    } else {
      setStatus("Nyomd meg a 🎤 gombot a beszélgetéshez (vagy írj)");
    }
  }

  // Events
  btnMic.addEventListener("click", function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (!greetingDone) {
      greetingDone = true;
      armed = true;
      const hi = "Szia! Én Divi vagyok — hallgatlak!";
      addChat("bot", hi);
      showBubble(hi);
    }
    toggleMic();
  });
  chatForm.addEventListener("submit", function (e) {
    e.preventDefault();
    handleUserText(userInput.value);
  });

  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      if (chip.dataset.action === "reset") {
        stopListening();
        stopSpeech();
        brain.reset();
        chatLog.innerHTML = "";
        greetingDone = false;
        bootGreeting();
        return;
      }
      if (chip.dataset.prompt) handleUserText(chip.dataset.prompt);
    });
  });

  hitbox.addEventListener("click", async function () {
    if (busy) {
      character.react("react");
      return;
    }
    busy = true;
    stopListening();
    const line = brain.tapReaction();
    character.react("laugh");
    addChat("bot", line.text);
    await speak(line.text);
    busy = false;
  });

  hitbox.addEventListener("pointermove", function (e) {
    const rect = hitbox.getBoundingClientRect();
    character.lookAt((e.clientX - rect.left) / rect.width);
  });

  btnSettings.addEventListener("click", function () {
    settingsPanel.classList.toggle("hidden");
  });
  btnCloseSettings.addEventListener("click", function () {
    saveSettings();
    settingsPanel.classList.add("hidden");
  });
  engineSelect.addEventListener("change", toggleEngine);
  [apiKeyInput, voiceIdInput, openAiKeyInput, echoModeInput, autoListenInput].forEach(function (el) {
    el.addEventListener("change", saveSettings);
  });

  if ("speechSynthesis" in window) {
    speechSynthesis.onvoiceschanged = function () {
      cachedMaleVoice = pickMaleHuVoice();
    };
    cachedMaleVoice = pickMaleHuVoice();
  }

  loadSettings();

  let armed = false;
  function arm(e) {
    if (armed) return;
    // A mikrofon saját magának kezdi a beszélgetést — ne ütközzön a köszönéssel
    if (e.target && e.target.closest && e.target.closest("#btn-mic")) return;
    armed = true;
    bootGreeting();
  }
  document.addEventListener("pointerdown", arm);

  const earlyWarn = micUnsupportedReason();
  if (earlyWarn) {
    setStatus(earlyWarn);
  } else {
    setStatus("Koppints bárhova a kezdéshez, vagy nyomd meg a 🎤 gombot");
  }

  btnMic.setAttribute("aria-pressed", "false");
  btnMic.title = "Mikrofon bekapcsolása";
})();

  </script>
</body>
</html>
