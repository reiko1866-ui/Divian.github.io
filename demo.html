<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Divi — interaktív beszélő vörös panda. Kérdez, felel, játszik veled." />
  <title>Divi — Beszélő vörös panda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --sky-top: #7ec8e3;
  --sky-bottom: #c8e7f5;
  --floor: #8fbc8f;
  --ink: #1d3557;
  --foam: #fff8f0;
  --accent: #e76f51;
  --accent-deep: #d62828;
  --mint: #2a9d8f;
  --mint-deep: #1f7a6f;
  --bubble: #ffffff;
  --shadow: rgba(29, 53, 87, 0.14);
  --font-display: "Fredoka", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: linear-gradient(180deg, #f7fbff 0%, #e8f5e9 55%, #c8e6c9 100%);
  min-height: 100vh;
  min-height: 100dvh;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  position: relative;
  overflow: hidden;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 8px;
  z-index: 5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  font-size: 1.6rem;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.08));
}

.brand h1 {
  font-family: var(--font-display);
  font-size: 1.7rem;
  margin: 0;
  line-height: 1;
  letter-spacing: 0.02em;
}

.tagline {
  margin: 2px 0 0;
  font-size: 0.82rem;
  opacity: 0.75;
}

.icon-btn {
  border: none;
  background: rgba(255, 255, 255, 0.7);
  width: 42px;
  height: 42px;
  border-radius: 14px;
  font-size: 1.2rem;
  cursor: pointer;
  box-shadow: 0 4px 12px var(--shadow);
}

.settings-drawer {
  position: absolute;
  inset: 12px 12px auto;
  z-index: 20;
  background: var(--foam);
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
  display: grid;
  gap: 8px;
}

.settings-drawer h2 {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-size: 1.2rem;
}

.settings-drawer label {
  font-weight: 700;
  font-size: 0.85rem;
}

.settings-drawer select,
.settings-drawer input[type="password"],
.settings-drawer input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid rgba(29, 53, 87, 0.12);
  border-radius: 12px;
  font: inherit;
  background: #fff;
  color: var(--ink);
}

.toggle-row {
  display: flex !important;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  cursor: pointer;
}

.hint {
  margin: 4px 0 0;
  font-size: 0.8rem;
  line-height: 1.35;
  font-weight: 600;
  opacity: 0.8;
}

.primary-btn {
  margin-top: 6px;
  border: none;
  background: var(--mint);
  color: #fff;
  font: inherit;
  font-weight: 700;
  padding: 12px 16px;
  border-radius: 14px;
  cursor: pointer;
}

.primary-btn:hover {
  background: var(--mint-deep);
}

.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 16px 0;
  min-height: 0;
}

.room {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.9), transparent 45%),
    linear-gradient(180deg, transparent 70%, rgba(120, 180, 90, 0.12) 100%);
}

.speech-bubble {
  position: relative;
  z-index: 3;
  max-width: min(90%, 340px);
  margin-bottom: 8px;
  background: var(--bubble);
  color: var(--ink);
  padding: 12px 16px;
  border-radius: 18px;
  box-shadow: 0 8px 24px var(--shadow);
  animation: bubble-in 0.35s ease;
}

.speech-bubble::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -10px;
  transform: translateX(-50%);
  border: 10px solid transparent;
  border-top-color: var(--bubble);
}

.speech-bubble p {
  margin: 0;
  font-size: 1.05rem;
  line-height: 1.35;
  font-weight: 700;
}

.character-wrap {
  position: relative;
  z-index: 2;
  border: none;
  background: transparent;
  padding: 0;
  cursor: pointer;
  width: min(88vw, 380px);
  outline: none;
}

.character {
  width: 100%;
  height: auto;
  overflow: visible;
  filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.12));
}

.tap-hint {
  display: block;
  margin-top: -6px;
  font-family: var(--font-display);
  font-size: 0.9rem;
  opacity: 0.65;
}

.status-line {
  z-index: 2;
  margin: 10px 0 0;
  font-size: 0.92rem;
  font-weight: 700;
  opacity: 0.8;
  text-align: center;
  min-height: 1.3em;
}

/* Character animation states */
.character .body,
.character .head {
  transform-box: view-box;
}

.character .body {
  transform-origin: 155px 220px;
}

.character .head {
  transform-origin: 155px 125px;
}

.character.state-idle .body {
  animation: breathe 3.2s ease-in-out infinite;
}

.character.state-idle .head {
  animation: sway 4s ease-in-out infinite;
}

.character.state-idle .blink-lid {
  animation: blink 4.8s infinite;
}

.character.state-listening .ear-left {
  animation: ear-twitch 0.7s ease-in-out infinite;
}

.character.state-listening .ear-right {
  animation: ear-twitch 0.7s ease-in-out infinite reverse;
}

.character.state-listening .pupil {
  animation: look-around 2.4s ease-in-out infinite;
}

.character.state-thinking .head {
  animation: think-tilt 1.2s ease-in-out infinite;
}

/* Szájat a JS lip-sync mozgatja — nincs mechanikus CSS nyit-csuk */
.character.state-speaking .head {
  animation: speak-nod 2.4s ease-in-out infinite;
}

.character.state-speaking .blink-lid {
  animation: blink 5.5s infinite;
}

.character .mouth-open,
.character .mouth-tongue,
.character .mouth-closed {
  transition: opacity 0.05s linear;
}

.character.state-react .body {
  animation: bounce 0.55s ease;
}

.character.state-react .head {
  animation: bounce-head 0.55s ease;
}

.character.state-laugh .mouth-closed {
  opacity: 0;
}

.character.state-laugh .mouth-open,
.character.state-laugh .mouth-tongue {
  opacity: 1;
}

.character.state-laugh .body {
  animation: giggle 0.45s ease-in-out 3;
}

.character.state-idle .tail {
  transform-origin: 220px 220px;
  animation: tail-sway 3.6s ease-in-out infinite;
}

.character .body {
  transform-origin: 155px 220px;
}

.character .head {
  transform-origin: 155px 125px;
}

@keyframes tail-sway {
  0%, 100% { transform: rotate(-4deg); }
  50% { transform: rotate(6deg); }
}

@keyframes sway {
  0%, 100% { transform: rotate(-1.5deg); }
  50% { transform: rotate(1.5deg); }
}

@keyframes blink {
  0%, 92%, 100% { opacity: 0; }
  94%, 96% { opacity: 1; }
}

@keyframes ear-twitch {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-8deg); }
}

@keyframes look-around {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(3px, -1px); }
  75% { transform: translate(-3px, 1px); }
}

@keyframes think-tilt {
  0%, 100% { transform: rotate(-4deg) translateY(0); }
  50% { transform: rotate(4deg) translateY(-3px); }
}

@keyframes speak-nod {
  0%, 100% { transform: rotate(-0.8deg) translateY(0); }
  40% { transform: rotate(1deg) translateY(-2px); }
  70% { transform: rotate(-0.4deg) translateY(1px); }
}

@keyframes bounce {
  0% { transform: translateY(0) scale(1); }
  35% { transform: translateY(-28px) scale(1.04, 0.96); }
  70% { transform: translateY(4px) scale(0.98, 1.03); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes bounce-head {
  0% { transform: translateY(0); }
  35% { transform: translateY(-10px) rotate(-4deg); }
  100% { transform: translateY(0); }
}

@keyframes giggle {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-3deg) scale(1.02); }
  75% { transform: rotate(3deg) scale(1.02); }
}

@keyframes bubble-in {
  from { opacity: 0; transform: translateY(8px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.chat-dock {
  z-index: 5;
  background: linear-gradient(180deg, rgba(255, 248, 240, 0.55), var(--foam) 28%);
  border-radius: 24px 24px 0 0;
  padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
  box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.08);
}

.chat-log {
  max-height: 120px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
  padding: 4px 2px;
}

.chat-msg {
  max-width: 88%;
  padding: 8px 12px;
  border-radius: 14px;
  font-size: 0.92rem;
  line-height: 1.35;
  font-weight: 600;
  animation: bubble-in 0.25s ease;
}

.chat-msg.bot {
  align-self: flex-start;
  background: #fff;
  box-shadow: 0 2px 8px var(--shadow);
}

.chat-msg.user {
  align-self: flex-end;
  background: #ffe0c2;
}

.chat-form {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px;
  align-items: center;
}

.mic-btn,
.send-btn {
  border: none;
  cursor: pointer;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  font-size: 1.35rem;
}

.mic-btn {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 8px 18px rgba(231, 111, 81, 0.35);
}

.mic-btn.listening {
  background: var(--accent-deep);
  animation: pulse-mic 1s ease-in-out infinite;
}

.mic-wave {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid rgba(231, 111, 81, 0.45);
  opacity: 0;
}

.mic-btn.listening .mic-wave {
  animation: ripple 1s ease-out infinite;
}

.send-btn {
  background: var(--mint);
  color: #fff;
  font-size: 1.1rem;
}

#user-input {
  width: 100%;
  border: 2px solid rgba(29, 53, 87, 0.1);
  border-radius: 999px;
  padding: 12px 16px;
  font: inherit;
  font-weight: 600;
  background: #fff;
  color: var(--ink);
}

.quick-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.chip {
  border: none;
  background: rgba(42, 157, 143, 0.14);
  color: var(--mint-deep);
  font: inherit;
  font-weight: 700;
  font-size: 0.85rem;
  padding: 8px 12px;
  border-radius: 999px;
  cursor: pointer;
}

.chip:hover {
  background: rgba(42, 157, 143, 0.24);
}

@keyframes pulse-mic {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

@keyframes ripple {
  from { transform: scale(0.9); opacity: 0.8; }
  to { transform: scale(1.35); opacity: 0; }
}

.hidden {
  display: none !important;
}

@media (min-height: 780px) {
  .chat-log {
    max-height: 160px;
  }

  .character-wrap {
    width: min(78vw, 360px);
  }
}

  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🐼</span>
        <div>
          <h1>Divi</h1>
          <p class="tagline">Beszélő vörös pandád</p>
        </div>
      </div>
      <button type="button" id="btn-settings" class="icon-btn" aria-label="Beállítások" title="Beállítások">⚙️</button>
    </header>

    <aside id="settings-panel" class="settings-drawer hidden" aria-label="Beállítások">
      <h2>Beállítások</h2>
      <label for="engine-select">Hang motor</label>
      <select id="engine-select">
        <option value="native">Böngésző hang (ingyenes)</option>
        <option value="elevenlabs">ElevenLabs (API)</option>
      </select>

      <div id="elevenlabs-inputs" class="hidden">
        <label for="api-key">ElevenLabs API kulcs</label>
        <input type="password" id="api-key" autocomplete="off" placeholder="sk-…" />
        <label for="voice-id">Férfi Voice ID</label>
        <select id="voice-id">
          <option value="pNInz6obpgDQGcFmaJgB" selected>Adam</option>
          <option value="VR6AewLTigWG4xSOukaG">Arnold</option>
          <option value="TxGEqnHWrfWFTfGW9XjX">Josh</option>
          <option value="ErXwobaYiN019PkySvjV">Antoni</option>
        </select>
      </div>

      <label for="openai-key">OpenAI kulcs (opcionális, okosabb AI)</label>
      <input type="password" id="openai-key" autocomplete="off" placeholder="sk-… üresen is megy" />

      <label class="toggle-row" for="echo-mode">
        <input type="checkbox" id="echo-mode" />
        Vicces visszhang mód (mint Talking Tom)
      </label>

      <label class="toggle-row" for="auto-listen">
        <input type="checkbox" id="auto-listen" checked />
        Válasz után újra hallgat

      <p class="hint" id="mic-help">
        Mikrofon: Chrome vagy Edge ajánlott, HTTPS-en (GitHub Pages).

        Engedély: címsor 🔒 → Mikrofon → Engedélyezés.
      </p>

      <button type="button" id="btn-close-settings" class="primary-btn">Kész</button>
    </aside>

    <main class="stage">
      <div class="room" aria-hidden="true"></div>

      <div id="speech-bubble" class="speech-bubble hidden" role="status" aria-live="polite">
        <p id="bubble-text"></p>

      <button type="button" id="character-hitbox" class="character-wrap" aria-label="Koppints Divire">

          <defs>
            <linearGradient id="furRed" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f28b4b" />

            </linearGradient>

              <stop offset="0%" stop-color="#4a3428" />
              <stop offset="100%" stop-color="#2a1c16" />
            </linearGradient>
            <linearGradient id="bamboo" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#b8d96a" />
              <stop offset="100%" stop-color="#7fad3a" />
            </linearGradient>
          </defs>

          <!-- háttér bambuszok -->

            <rect x="28" y="20" width="18" height="280" rx="8" fill="url(#bamboo)" />
            <rect x="28" y="70" width="18" height="6" fill="#6f9a32" opacity="0.5" />

            <rect x="270" y="160" width="16" height="5" fill="#6f9a32" opacity="0.5" />
            <ellipse cx="278" cy="48" rx="18" ry="8" fill="#6f9a32" />

          <!-- talaj -->
          <ellipse cx="160" cy="395" rx="120" ry="16" fill="rgba(40,30,20,0.12)" />

              <ellipse class="blink-lid lid-left" cx="125" cy="118" rx="17" ry="18" fill="#e06a2c" opacity="0" />
              <ellipse class="blink-lid lid-right" cx="185" cy="118" rx="17" ry="18" fill="#e06a2c" opacity="0" />
            </g>

            <g class="mouth">
              <path class="mouth-closed" d="M138 160 Q155 172 172 160" fill="none" stroke="#1a120e" stroke-width="3.2" stroke-linecap="round" />
              <ellipse class="mouth-open" cx="155" cy="166" rx="12" ry="3" fill="#1a120e" opacity="0" />

        <button type="button" class="chip" data-prompt="Tegyél fel egy kérdést!">Kérdezz</button>

  </div>

  <script>
/**
 * Divi beszélgető agy — gyerekeknek, poénos, tényleg válaszol a kérdésekre
 */
(function (global) {
  const QUESTIONS = [
    "Mi a neved?",
    "Hány éves vagy?",
    "Mi a kedvenc állatod?",
    "Szeretsz mesét hallgatni?",
    "Mi a kedvenc színed?",
    "Mi volt ma a legviccesebb dolog?",
    "Ha tudnál repülni, hová mennél?",
    "Mi a kedvenc ételed? Az enyém a mézes pogácsa… bár lehet, hogy csak álmodom róla!",
    "Van legjobb barátod?",
    "Milyen játékot szeretsz?",
    "Mi szokott megnevettetni?",
    "Ha varázserőd lenne, mi lenne az?",
    "Szeretsz inkább bent vagy kint játszani?",
    "Ki a te kedvenc mesefigurád?",
    "Melyik állat tudna a legjobban kuncogni?",
  ];

  const JOKES = [
    "Miért piros a vörös panda? Mert elpirult a poénjaimon! Hehe!",
    "Mit csinál a panda a fán? Pandázik! …oké, ez gyenge volt, a farkam is elpirult.",
    "Kopogtatás! Ki az? Panda. Melyik panda? A vö-röö-ös! Haha!",
    "Miért visz a vörös panda bambuszt a suliba? Hogy ne éhezzen a szünetben!",
    "Mit mond a farkam, ha örül? Csóválok gyűrűkben!",
    "Mi a medve kedvenc italá? A málna-tea… mert málnás!",
    "Mit mondott az egyik szem a másiknak? Közöttünk a mag!",
    "Miért ment a zsiráf az orvoshoz? Mert nyakig volt a bajban!",
  ];

  const DIVI_FAVES = {
    character: [
      "Az én kedvenc mesefigurám… Mei a Vörösből! Mert ő is tud pandává változni — én meg mindig az vagyok!",
      "Hú, nehéz! De ha választanom kell: Pán Péter! Mert soha nem nő fel — én sem akarok unalmas felnőtt lenni!",
      "A kedvencem Olaf a hóember! Mert állandóan hülyéskedik, mint én. Én meg a farkammal integetek.",
      "Én Stitchet imádom! Ő is káosz, én is káosz. Ohana azt jelenti: senkit sem hagyunk le a poénról!",
    ],
    color: [
      "A kedvenc színem a vöröses-narancs — nézd csak a bundámat! Mintha egy naplemente lenne, ami beszél!",
      "Szeretem a fehéret is a maszkomban, meg a csíkos farkamat. De a vörös a bajnok!",
    ],
    food: [
      "A kedvenc kajám a bambusz… na jó, inkább a képzeletbeli áfonyás palacsinta. Virtuális kalória: nulla!",
      "Én a gyümölcsolót imádom… főleg ha te mesélsz mellé!",
    ],
    animal: [
      "A kedvenc állatom… a vörös panda! Várj. Az én vagyok. Akkor a második: a lajhár, mert buja és vicces.",
      "Imádom a pandákat! A nagy fehéret is, meg engem, a vöröset. Dupla panda-erő!",
    ],
    age: [
      "Én örök gyerek vagyok: annyi idős, ahány csík van a farkamon. Számold meg… sok!",
      "A korom: háromszor kettő plusz egy nevetés. Számold ki te!",
    ],
    name: [
      "A nevem Divi! Divi, a dumás vörös panda. Nem Divinyátor, nem Divi-Man — csak Divi.",
      "Engem Divinek hívnak. Ha elfelejted, csiklandozz meg, és elkiáltom újra!",
    ],
  };

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function withName(memory, text) {
    if (memory.name && Math.random() > 0.45) {
      return text.replace(/!$/, ", " + memory.name + "!");
    }
    return text;
  }

  /** ASR zajszűrés / gyakori félrehallások */
  function normalizeSpeech(raw) {
    let t = String(raw || "").trim();
    t = t.replace(/\s+/g, " ");
    const fixes = [
      [/divi|didi|tiví|tivi|dévi/gi, "Divi"],
      [/mes[eé]\s*figur[aáe]?d?/gi, "mesefigurád"],
      [/kedvenc(e|ed)?\s+figur/gi, "kedvenc mesefigurád"],
      [/hány éves vagy\??/gi, "hány éves vagy"],
      [/mi a neved\??/gi, "mi a neved"],
      [/mondj egy viccet|viccet kérnék|poént/gi, "mondj egy viccet"],
    ];
    fixes.forEach(function (pair) {
      t = t.replace(pair[0], pair[1]);
    });
    return t;
  }

  function isQuestionToDivi(text) {
    const t = text.toLowerCase();
    // „te/neked/divinek” + kérdés, vagy klasszikus kérdőszavak Divi felé
    if (/^(ki|mi|milyen|hány|hol|hogyan|merre|mikor)\b/.test(t) && /\?|vagy|a te|tied|neked|divi/i.test(text)) {
      return true;
    }
    if (/\b(te|neked|tied|divi)\b/.test(t) && /(kedvenc|szeret|hívnak|neved|vagy|figurd)/i.test(t)) {
      return true;
    }
    if (/ki a kedvenc|mi a kedvenc|kit szeretsz|mit szeretsz|melyik a kedvenc/i.test(t)) {
      return true;
    }
    if (/hány éves vagy|mi a neved|hogy hívnak|ki vagy te/i.test(t)) {
      return true;
    }
    return /\?$/.test(t.trim());
  }

  function answerAboutDivi(text) {
    const t = text.toLowerCase();

    if (/mesefigur|mese figur|figurád|figurad|winnie|pooh|olaf|stitch|pán péter|pan peter/i.test(t) ||
        (/kedvenc/i.test(t) && /mese|figur|hős|hos|szerepl/i.test(t))) {
      return { text: pick(DIVI_FAVES.character) + " És neked ki a kedvenced?", emotion: "laugh" };
    }
    if (/kedvenc szín|mi.*színed|színedet/i.test(t)) {
      return { text: pick(DIVI_FAVES.color) + " Neki mi a tied?", emotion: "speaking" };
    }
    if (/kedvenc étel|kaja|enni|ételed|eteled/i.test(t)) {
      return { text: pick(DIVI_FAVES.food) + " Te mit ennél most?", emotion: "speaking" };
    }
    if (/kedvenc állat|állatod|allatod/i.test(t)) {
      return { text: pick(DIVI_FAVES.animal) + " Neked mi a kedvenced?", emotion: "speaking" };
    }
    if (/hány éves|korod|idős vagy/i.test(t)) {
      return { text: pick(DIVI_FAVES.age), emotion: "laugh" };
    }
    if (/mi a neved|hogy hívnak|ki vagy/i.test(t)) {
      return { text: pick(DIVI_FAVES.name), emotion: "speaking" };
    }
    if (/kedvenc/i.test(t)) {
      return {
        text: "Jó kérdés! A kedvenc dolgom: veled dumálni és poénkodni. " + pick(DIVI_FAVES.character),
        emotion: "laugh",
      };
    }
    // Általános „te mit…” kérdés
    return {
      text: "Én? Én azt szeretem, ha nevetünk! " + pick(JOKES) + " Na, most te jössz: mi a tied?",
      emotion: "laugh",
    };
  }

  const TOPIC_REPLIES = [
    {
      keys: [/szia|helló|hello|szevasz|hey|csá|csa/i],
      replies: [
        "Sziaaa! A farkam már előre csóvál! Hogy vagy?",
        "Helló, szuperhős! Készen állsz egy adag poénra?",
        "Szevasz! Én Divi vagyok, a dumás vörös panda. Indulhat a nevetés?",
      ],
      followUp: "Mondj valamit magadról — vagy kérj egy viccet!",
    },
    {
      keys: [/hogy vagy|mizu|mi újság|mi ujsag|hogy megy/i],
      replies: [
        "Én remekül! Csóválom a csíkos farkam — ez a boldogság-antenna!",
        "Szuperul! Annyira, hogy a füleim is táncolnak!",
      ],
      followUp: "És te hogy vagy, bajnok?",
    },
    {
      keys: [/vicc|nevettes|poén|poen|vicces|humor|röhög|nevet/i],
      replies: null, // special
      joke: true,
    },
    {
      keys: [/mesélj.*mesét|mondj.*mesét|hallgatnék mesét|story time/i],
      replies: [
        "Egyszer volt, hol nem volt, egy vörös panda, akinek akkora csíkos farka volt, hogy zászlót csinált belőle. Aztán… elkezdett dumálni. Az én voltam!",
        "Hallgass ide: a csillagok összekacsintottak, és azt súgták: „Divi, mondj egy poént!” Én meg engedelmeskedtem!",
      ],
      followUp: "Tetszett? Kérjek egy másikat, vagy inkább viccet?",
    },
    {
      keys: [/szeretlek|barát|barat|jó vagy|jo vagy|kedvellek/i],
      replies: [
        "Ááá, ettől meleg a bundám! Én is örülök neked!",
        "Te vagy a kedvenc beszélgető-emberem! Puszi a levegőbe!",
      ],
      followUp: "Mi szokott téged boldoggá tenni?",
    },
    {
      keys: [/unatkoz|játsz|jatsz|játék|jate/i],
      replies: [
        "Játsszunk! Én kérdezek, te válaszolsz — és közben poénkodunk!",
        "Kvíz-idő! Figyelj, jön a kérdés…",
      ],
      ask: true,
    },
    {
      keys: [/kérdezz|kerdezz|tegyél fel|tegyel fel|kérdés.*nekem/i],
      replies: ["Oké, fülek bekapcsolva… jön a kérdés!", "Figyelj ide, bajnok!"],
      ask: true,
    },
    {
      keys: [/köszön|koszon|viszlát|viszlat|bye|cső|cso|sziasztok/i],
      replies: [
        "Viszlát! Vigyázz a mosolyodra, nehogy elveszítsd útközben!",
        "Puszi! Gyere vissza, hozok friss poénokat!",
      ],
    },
  ];

  function Brain() {
    this.memory = {
      name: "",
      age: "",
      likes: [],
      asked: [],
      turns: 0,
      favoriteCharacter: "",
    };
    this.history = [];
  }

  Brain.prototype.reset = function () {
    this.memory = { name: "", age: "", likes: [], asked: [], turns: 0, favoriteCharacter: "" };
    this.history = [];
  };

  Brain.prototype.rememberFromUser = function (text) {
    const t = text.trim();
    const nameMatch = t.match(/(?:a nevem|hívnak|hivnak|én)\s+([A-ZÁÉÍÓÖŐÚÜŰa-záéíóöőúüű]{2,20})/i);
    if (nameMatch) this.memory.name = nameMatch[1];
    const ageMatch = t.match(/(\d{1,2})\s*(?:éves|eves)/i);
    if (ageMatch) this.memory.age = ageMatch[1];

    const favMatch = t.match(/(?:kedvenc(?:em)?(?:\s+mesefigurám|\s+figurám)?\s*(?:az?\s+)?)\s*([A-ZÁÉÍÓÖŐÚÜŰa-záéíóöőúüű ]{2,40})/i);
    if (favMatch && !/mi a|ki a|kedvenced/i.test(t)) {
      this.memory.favoriteCharacter = favMatch[1].trim();
    }
    // „Az enyém a Micimackó” / „Szeretem Olafot”
    const simpleFav = t.match(/(?:az enyém|szeretem|imádom)\s+(?:a\s+|az\s+)?([A-ZÁÉÍÓÖŐÚÜŰa-záéíóöőúüű][A-ZÁÉÍÓÖŐÚÜŰa-záéíóöőúüű ]{1,30})/i);
    if (simpleFav && /figur|mese|mackó|olaf|elsa|anna|stitch|woody|buzz|shrek|pán|peter/i.test(t + " " + simpleFav[1])) {
      this.memory.favoriteCharacter = simpleFav[1].trim();
    }

    if (/szeretem|imádom|imadom|kedvenc/i.test(t) && !isQuestionToDivi(t)) {
      this.memory.likes.push(t.slice(0, 80));
      if (this.memory.likes.length > 5) this.memory.likes.shift();
    }
  };

  Brain.prototype.nextQuestion = function () {
    const unused = QUESTIONS.filter((q) => !this.memory.asked.includes(q));
    const pool = unused.length ? unused : QUESTIONS;
    let q = pick(pool);
    if (this.memory.name && /Mi a neved/.test(q) && unused.length) {
      q = pick(pool.filter((x) => !/Mi a neved/.test(x))) || q;
    }
    this.memory.asked.push(q);
    if (this.memory.asked.length > 12) this.memory.asked.shift();
    if (this.memory.name && Math.random() > 0.5) {
      return this.memory.name + ", " + q.charAt(0).toLowerCase() + q.slice(1);
    }
    return q;
  };

  Brain.prototype.localReply = function (userText) {
    this.memory.turns += 1;
    const text = normalizeSpeech(userText);

    if (text.length < 2) {
      return {
        text: "Hoppá, a füleim nem kapták a jelet! Mondd még egyszer, kicsit hangosabban!",
        emotion: "listening",
      };
    }

    // 1) Először: ha TŐLEM kérdeznek, VÁLASZOLJAK (ne kerüljem meg!)
    if (isQuestionToDivi(text)) {
      const ans = answerAboutDivi(text);
      ans.text = withName(this.memory, ans.text);
      return ans;
    }

    // 2) Vicc kérés
    if (/vicc|poén|poen|nevettes|röhögtess|humor/i.test(text)) {
      return {
        text: pick(JOKES) + " " + pick(["Kérjek még egyet?", "Te is mondj egyet!", "Ha nem nevettél, a füleim visszajárnak!"]),
        emotion: "laugh",
      };
    }

    // 3) Témaillesztés (vicc / szia / stb.)
    for (let i = 0; i < TOPIC_REPLIES.length; i += 1) {
      const topic = TOPIC_REPLIES[i];
      if (!topic.keys.some((re) => re.test(text))) continue;
      if (topic.joke) {
        return {
          text: pick(JOKES) + " Na, most te jössz egy mosollyal!",
          emotion: "laugh",
        };
      }
      let reply = pick(topic.replies);
      reply = withName(this.memory, reply);
      if (topic.ask) {
        return { text: reply + " " + this.nextQuestion(), emotion: "speaking", ask: true };
      }
      if (topic.followUp) {
        return { text: reply + " " + topic.followUp, emotion: "speaking" };
      }
      return { text: reply, emotion: "speaking" };
    }

    // 4) Ha a gyerek mesefigurát mondott
    if (this.memory.favoriteCharacter && /mackó|olaf|elsa|figur|kedvenc/i.test(text)) {
      return {
        text: "Szuper választás a(z) " + this.memory.favoriteCharacter + "! Én is magasra tartom a farkamat tiszteletből. " + pick(JOKES),
        emotion: "laugh",
      };
    }

    // 5) Név bemutatkozás
    if (/(?:a nevem|hívnak|hivnak)\s+\w+/i.test(text)) {
      return {
        text: "Örülök, hogy megismerhetlek" + (this.memory.name ? ", " + this.memory.name : "") + "! Én Divi vagyok. " + pick(["Mondjak egy viccet?", "Mesélj a kedvenc játékodról!"]),
        emotion: "speaking",
      };
    }

    // 6) Vicces elismerés + kérdés
    const acks = [
      "Haha, ez jó!",
      "A füleim tapsolnak!",
      "Szuper válasz, bajnok!",
      "Ezt felírom a poén-naplómba!",
      "Úúú, érdekes!",
      "Ettől kacsint a vörös bundám!",
    ];
    let reply = pick(acks);

    if (this.memory.turns <= 2 && !this.memory.name) {
      return {
        text: reply + " Először is: " + this.nextQuestion(),
        emotion: "speaking",
        ask: true,
      };
    }

    // Gyakran kérdezz vissza, de előbb adj egy mini-poént
    if (this.memory.turns % 3 === 0) {
      return {
        text: reply + " Mini-poén: " + pick(JOKES) + " " + this.nextQuestion(),
        emotion: "laugh",
        ask: true,
      };
    }

    if (this.memory.turns % 2 === 0 || /nem tudom|talán|igen|nem/i.test(text)) {
      return {
        text: reply + " " + this.nextQuestion(),
        emotion: "speaking",
        ask: true,
      };
    }

    const probes = [
      "Mesélj erről még egy picit!",
      "És mi volt a legviccesebb része?",
      "Ha ez egy mese lenne, mi lenne a címe?",
      "Kérjek erre egy poént, vagy folytassuk?",
    ];
    return { text: reply + " " + pick(probes), emotion: "speaking" };
  };

  Brain.prototype.greeting = function () {
    return {
      text:
        "Szia! Én Divi vagyok, a dumás vörös panda. Poénjaim vannak, farkam csíkos, és imádok veled beszélgetni! " +
        pick(JOKES) +
        " " +
        this.nextQuestion(),
      emotion: "laugh",
      ask: true,
    };
  };

  Brain.prototype.tapReaction = function () {
    const lines = [
      "Haha, csiklandozz! A poénjaim kicsordulnak!",
      "Hééé, az a hasam! Ott lakik a kuncogás!",
      "Újra! Újra! Én vagyok a csiklandozó-bajnok!",
      "Vicces vagy! Majdnem leestem a saját lábamról!",
      "A fülem érzékeny — ott van a nevetőgomb!",
    ];
    return { text: pick(lines), emotion: "laugh" };
  };

  Brain.prototype.echo = function (userText) {
    const funny = normalizeSpeech(userText)
      .replace(/[aá]/gi, "á")
      .replace(/[eé]/gi, "e")
      .replace(/[oóöő]/gi, "ó");
    return {
      text: funny + "! …hehe, csak utánoztalak! Most mondok egy igazi választ is: " + pick(JOKES),
      emotion: "laugh",
    };
  };

  Brain.prototype.buildOpenAIMessages = function (userText) {
    const system =
      "Te Divi vagy: vidám, poénos, beszélő animációs vörös panda gyerekeknek (Talking Tom stílus). " +
      "Magyarul beszélj, 1-3 rövid mondatban, sok kedves humorral. " +
      "HA A GYEREK TŐLED KÉRDEZ (pl. ki a kedvenc mesefigurád), ELŐSZÖR VÁLASZOLJ KONKRÉTAN, ne kerülgesd. " +
      "Utána kérdezhetsz vissza. Ne legyél ijesztő. Memória: " +
      JSON.stringify(this.memory);

    const msgs = [{ role: "system", content: system }];
    this.history.slice(-8).forEach((h) => msgs.push(h));
    msgs.push({ role: "user", content: userText });
    return msgs;
  };

  Brain.prototype.record = function (role, content) {
    this.history.push({ role: role, content: content });
    if (this.history.length > 20) this.history = this.history.slice(-20);
  };

  async function replyWithOpenAI(brain, userText, apiKey) {
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + apiKey,
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        temperature: 0.9,
        max_tokens: 200,
        messages: brain.buildOpenAIMessages(userText),
      }),
    });
    if (!res.ok) throw new Error("OpenAI HTTP " + res.status);
    const data = await res.json();
    const text = (((data.choices || [])[0] || {}).message || {}).content || "";
    return { text: text.trim() || "Hmm, elkalandoztam. Kérdezz rám bátran!", emotion: "speaking" };
  }

  Brain.prototype.reply = async function (userText, opts) {
    opts = opts || {};
    const cleaned = normalizeSpeech(userText);
    this.rememberFromUser(cleaned);
    this.record("user", cleaned);

    if (opts.echoMode) {
      const out = this.echo(cleaned);
      this.record("assistant", out.text);
      return out;
    }

    if (opts.openAiKey) {
      try {
        const out = await replyWithOpenAI(this, cleaned, opts.openAiKey);
        this.memory.turns += 1;
        this.record("assistant", out.text);

        return;
      }
      handled = true;
      stopListening();
      setStatus("Értem: „" + said + "”");
      handleUserText(said);
    }

    function scheduleCommit() {
      clearSilence();
      // Várj egy kis csendet — így a hosszabb kérdések is megmaradnak
      silenceTimer = setTimeout(commitSpeech, 1100);
    }

    rec.onstart = function () {
      listening = true;
      startingMic = false;
      handled = false;
      finalTranscript = "";
      clearSilence();
      btnMic.classList.add("listening");
      btnMic.setAttribute("aria-pressed", "true");
      character.setState("listening");
      setStatus("Hallgatlak… beszélj nyugodtan, megvárom amíg végzel");
    };

    rec.onresult = function (event) {
      let interim = "";
      // Csak az új részeket adjuk hozzá a finalhoz
      for (let i = event.resultIndex; i < event.results.length; i += 1) {
        const result = event.results[i];
        const piece = pickBestAlternative(result).trim();
        if (!piece) continue;
        if (result.isFinal) {
          finalTranscript = (finalTranscript + " " + piece).replace(/\s+/g, " ").trim();
          setStatus("Hallom: " + finalTranscript);
          scheduleCommit();
        } else {
          interim += (interim ? " " : "") + piece;
          setStatus("Hallom: " + (finalTranscript ? finalTranscript + " " : "") + interim + "…");
          // Ha van interim, toljuk a csend-órát
          if (finalTranscript) scheduleCommit();
        }
      }
    };

    rec.onerror = function (event) {
      clearSilence();
      listening = false;
      startingMic = false;
      btnMic.classList.remove("listening");
      btnMic.setAttribute("aria-pressed", "false");
      character.setState("idle");

      const err = event.error || "";
      if (err === "not-allowed" || err === "service-not-allowed") {
        micPermission = "denied";
        setStatus("Mikrofon tiltva. A címsor 🔒 ikonnál engedd engedélyezni, majd nyomd újra a mikrofont.");
      } else if (err === "no-speech") {
        // Egy automatikus újrapróbálás
        if (!handled && micPermission === "granted") {
          setStatus("Nem hallottam — figyelek még egy kicsit…");
          setTimeout(function () {
            if (!busy && !listening) startListening();
          }, 400);
        } else {
          setStatus("Nem hallottam semmit — nyomd meg újra a mikrofont");
        }
      } else if (err === "audio-capture") {
        setStatus("Nem találok mikrofont. Csatlakoztass egyet, vagy írj szöveggel.");
      } else if (err === "network") {
        setStatus("A beszédfelismeréshez net kell (Chrome felhőszolgáltatás).");
      } else if (err !== "aborted") {
        setStatus("Mikrofon hiba (" + err + "). Próbáld újra, vagy írj.");
      }
    };

    rec.onend = function () {
      clearSilence();
      // Ha van félkész szöveg és még nem kezeltük — mentsük
      if (!handled && finalTranscript.trim() && !busy) {
        commitSpeech();
        return;
      }
      listening = false;
      startingMic = false;
      btnMic.classList.remove("listening");
      btnMic.setAttribute("aria-pressed", "false");
      if (!busy && character.state === "listening") character.setState("idle");
    };

    rec._clearSilence = clearSilence;
    return rec;
  }

  async function startListening() {
    if (listening || startingMic) return;

    const blocked = micUnsupportedReason();
    if (blocked) {
      setStatus(blocked);
      showBubble(blocked);
      return;
    }

    // Ha Divi beszél / gondolkodik: szakítsuk meg, hogy a mic működjön
    if (busy) {
      stopSpeech();
      busy = false;
      character.setState("idle");
    } else {
      stopSpeech();
    }

    startingMic = true;
    btnMic.classList.add("listening");
    setStatus("Mikrofon indítása…");

    try {
      await ensureMicPermission();
    } catch (err) {
      startingMic = false;
      btnMic.classList.remove("listening");
      micPermission = "denied";
      const msg =
        "Nem kaptam mikrofon-engedélyt. A böngésző címsorában (🔒) engedd a mikrofont ehhez az oldalhoz, majd próbáld újra.";
      setStatus(msg);
      showBubble(msg);
      return;
    }

    const rec = recreateRecognition();
    if (!rec) {
      startingMic = false;
      btnMic.classList.remove("listening");
      setStatus(micUnsupportedReason() || "Beszédfelismerés nem elérhető.");
      return;
    }

    try {
      rec.start();
    } catch (err) {
      // Már fut — próbáljuk új példánnyal
      try {
        const again = recreateRecognition();
        if (again) again.start();
      } catch (err2) {
        startingMic = false;
        btnMic.classList.remove("listening");
        setStatus("Nem indult a mikrofon. Nyomd meg még egyszer.");
        console.warn(err2);
      }
    }
  }

  function toggleMic() {
    if (listening || startingMic) {
      stopListening();
      startingMic = false;
      character.setState("idle");
      setStatus("Megállítottam a hallgatást");
      return;
    }
    startListening();
  }

  async function bootGreeting() {
    if (greetingDone) return;
    greetingDone = true;
    const warn = micUnsupportedReason();
    if (warn) setStatus(warn);
    const g = brain.greeting();
    addChat("bot", g.text);
    await speak(g.text);
    // Auto-listen csak ha nem iframe/preview és van esély a micre
    if (autoListenInput.checked && !micUnsupportedReason() && micPermission !== "denied") {
      setTimeout(function () {
        startListening();
      }, 400);
    } else {
      setStatus("Nyomd meg a 🎤 gombot a beszélgetéshez (vagy írj)");
    }
  }

  // Events
  btnMic.addEventListener("click", function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (!greetingDone) {
      greetingDone = true;
      armed = true;
      const hi = "Szia! Én Divi vagyok, a vörös pandád — hallgatlak!";
      addChat("bot", hi);
      showBubble(hi);
    }
    toggleMic();
  });
  chatForm.addEventListener("submit", function (e) {
    e.preventDefault();
    handleUserText(userInput.value);
  });

  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      if (chip.dataset.action === "reset") {
        stopListening();
        stopSpeech();
        brain.reset();
        chatLog.innerHTML = "";
        greetingDone = false;
        bootGreeting();
        return;
      }
      if (chip.dataset.prompt) handleUserText(chip.dataset.prompt);
    });
  });

  hitbox.addEventListener("click", async function () {
    if (busy) {
      character.react("react");
      return;
    }
    busy = true;
    stopListening();
    const line = brain.tapReaction();
    character.react("laugh");
    addChat("bot", line.text);
    await speak(line.text);
    busy = false;
  });

  hitbox.addEventListener("pointermove", function (e) {
    const rect = hitbox.getBoundingClientRect();
    character.lookAt((e.clientX - rect.left) / rect.width);
  });

  btnSettings.addEventListener("click", function () {
    settingsPanel.classList.toggle("hidden");
  });
  btnCloseSettings.addEventListener("click", function () {
    saveSettings();
    settingsPanel.classList.add("hidden");
  });
  engineSelect.addEventListener("change", toggleEngine);
  [apiKeyInput, voiceIdInput, openAiKeyInput, echoModeInput, autoListenInput].forEach(function (el) {
    el.addEventListener("change", saveSettings);
  });

  if ("speechSynthesis" in window) {
    speechSynthesis.onvoiceschanged = function () {
      cachedMaleVoice = pickMaleHuVoice();
    };
    cachedMaleVoice = pickMaleHuVoice();
  }

  loadSettings();

  let armed = false;
  function arm(e) {
    if (armed) return;
    // A mikrofon saját magának kezdi a beszélgetést — ne ütközzön a köszönéssel
    if (e.target && e.target.closest && e.target.closest("#btn-mic")) return;
    armed = true;
    bootGreeting();
  }
  document.addEventListener("pointerdown", arm);

  const earlyWarn = micUnsupportedReason();
  if (earlyWarn) {
    setStatus(earlyWarn);
  } else {
    setStatus("Koppints bárhova a kezdéshez, vagy nyomd meg a 🎤 gombot");
  }

  btnMic.setAttribute("aria-pressed", "false");
  btnMic.title = "Mikrofon bekapcsolása";
})();

  </script>
</body>
