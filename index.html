<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interaktív Mesemondó — Disney-alapú választásos mese ElevenLabs vagy böngésző hanggal." />
  <title>Interaktív Mesemondó</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>✨ Interaktív Mesemondó ✨</h1>

    <div class="settings-panel">
      <label for="engine-select">Felolvasó motor:</label>
      <select id="engine-select">
        <option value="native">Böngésző beépített hangja (ingyenes)</option>
        <option value="elevenlabs">ElevenLabs AI hang (prémium API)</option>
      </select>

      <label class="toggle-row" for="auto-speak">
        <input type="checkbox" id="auto-speak" checked />
        Automatikus felolvasás minden fejezetnél
      </label>

      <div id="elevenlabs-inputs" class="hidden">
        <input type="password" id="api-key" placeholder="ElevenLabs API kulcs" autocomplete="off" />
        <label for="voice-id">Férfi mesélő Voice ID</label>
        <select id="voice-id">
          <option value="pNInz6obpgDQGcFmaJgB" selected>Adam — mély férfi</option>
          <option value="VR6AewLTigWG4xSOukaG">Arnold — erős férfi</option>
          <option value="TxGEqnHWrfWFTfGW9XjX">Josh — fiatal férfi</option>
          <option value="ErXwobaYiN019PkySvjV">Antoni — lágy férfi</option>
        </select>
        <p class="hint">Csak férfi hangok. Női Voice ID-t ne használj.</p>
      </div>
    </div>

    <section id="setup-panel" class="setup-panel">
      <label for="disney-select">Disney mese kiválasztása:</label>
      <select id="disney-select">
        <option value="">— Válassz Disney mesét (összes) —</option>
      </select>

      <label for="wish-input">Vagy írd le, mit szeretnél (opcionális):</label>
      <textarea id="wish-input" rows="2" maxlength="400" placeholder="Pl. a báljelenet, a jégpalota, a kívánságok…"></textarea>

      <div class="setup-row">
        <label class="inline">
          Hangulat
          <select id="mood-select">
            <option value="vidam">Vidám</option>
            <option value="kalandos">Kalandos</option>
            <option value="mesés" selected>Mesés</option>
          </select>
        </label>
        <label class="inline">
          Hős neve
          <input type="text" id="hero-name" maxlength="40" placeholder="opcionális" />
        </label>
      </div>

      <div class="audio-controls">
        <button type="button" id="btn-start">Induljon a mese</button>
        <button type="button" id="btn-surprise" class="secondary-btn">Véletlen Disney mese</button>
      </div>
    </section>

    <section id="story-panel" class="hidden">
      <p class="film-badge" id="film-badge"></p>
      <p class="chapter-label" id="chapter-label">1. fejezet</p>
      <h2 class="story-title" id="story-title">A te meséd</h2>
      <div id="story-text" class="story-box">Töltés...</div>
      <p id="speak-status" class="speak-status hidden" aria-live="polite"></p>

      <div class="audio-controls">
        <button type="button" id="btn-speak">🔊 Felolvasás</button>
        <button type="button" id="btn-stop">⏹️ Leállítás</button>
        <button type="button" id="btn-new" class="secondary-btn">Új mese</button>
      </div>

      <div id="choices-container" class="choices"></div>

      <div class="footer-actions">
        <button type="button" id="btn-download" class="secondary-btn">Mese mentése</button>
        <button type="button" id="btn-finish" class="secondary-btn">Mesét lezárom mára</button>
      </div>
    </section>
  </div>

  <script src="story-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
