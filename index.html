<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interaktív Mesemondó — választásos mese ElevenLabs vagy böngésző hanggal." />
  <title>Interaktív Mesemondó</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>✨ Interaktív Mesemondó ✨</h1>

    <div class="settings-panel">
      <label for="engine-select">Felolvasó motor kiválasztása:</label>
      <select id="engine-select">
        <option value="native">Böngésző beépített hangja (Ingyenes)</option>
        <option value="elevenlabs">ElevenLabs AI Hang (Prémium API)</option>
      </select>

      <div id="elevenlabs-inputs" class="hidden">
        <input type="password" id="api-key" placeholder="ElevenLabs API Kulcs" autocomplete="off" />
        <input type="text" id="voice-id" placeholder="Voice ID (pl. pNInz6obpgDQGcFmaJgB)" autocomplete="off" />
      </div>
    </div>

    <section id="setup-panel" class="setup-panel">
      <label for="wish-input">Milyen mesét szeretnél?</label>
      <textarea id="wish-input" rows="3" maxlength="400" placeholder="Pl. egy kis róka a Varázserdőben…"></textarea>

      <div class="setup-row">
        <label class="inline">
          Hangulat
          <select id="mood-select">
            <option value="vidam">Vidám</option>
            <option value="kalandos">Kalandos</option>
            <option value="mesés" selected>Mesés</option>
          </select>
        </label>
        <label class="inline">
          Hős neve
          <input type="text" id="hero-name" maxlength="40" placeholder="opcionális" />
        </label>
      </div>

      <div class="audio-controls">
        <button type="button" id="btn-start">Induljon a mese</button>
        <button type="button" id="btn-surprise" class="secondary-btn">Meglepetés mese</button>
      </div>
    </section>

    <section id="story-panel" class="hidden">
      <p class="chapter-label" id="chapter-label">1. fejezet</p>
      <h2 class="story-title" id="story-title">A te meséd</h2>
      <div id="story-text" class="story-box">Töltés...</div>

      <div class="audio-controls">
        <button type="button" id="btn-speak">🔊 Újraolvasás</button>
        <button type="button" id="btn-stop">⏹️ Leállítás</button>
        <button type="button" id="btn-new" class="secondary-btn">Új mese</button>
      </div>

      <div id="choices-container" class="choices"></div>

      <div class="footer-actions">
        <button type="button" id="btn-download" class="secondary-btn">Mese mentése</button>
        <button type="button" id="btn-finish" class="secondary-btn">Mesét lezárom mára</button>
      </div>
    </section>
  </div>

  <script src="story-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
