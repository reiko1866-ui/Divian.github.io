<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Divi — interaktív beszélő vörös panda. Kérdez, felel, játszik veled." />
  <title>Divi — Beszélő vörös panda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🐼</span>
        <div>
          <h1>Divi</h1>
          <p class="tagline">Beszélő vörös pandád</p>
        </div>
      </div>
      <button type="button" id="btn-settings" class="icon-btn" aria-label="Beállítások" title="Beállítások">⚙️</button>
    </header>

    <aside id="settings-panel" class="settings-drawer hidden" aria-label="Beállítások">
      <h2>Beállítások</h2>
      <label for="engine-select">Hang motor</label>
      <select id="engine-select">
        <option value="native">Böngésző hang (ingyenes)</option>
        <option value="elevenlabs">ElevenLabs (API)</option>
      </select>

      <div id="elevenlabs-inputs" class="hidden">
        <label for="api-key">ElevenLabs API kulcs</label>
        <input type="password" id="api-key" autocomplete="off" placeholder="sk-…" />
        <label for="voice-id">Férfi Voice ID</label>
        <select id="voice-id">
          <option value="pNInz6obpgDQGcFmaJgB" selected>Adam</option>
          <option value="VR6AewLTigWG4xSOukaG">Arnold</option>
          <option value="TxGEqnHWrfWFTfGW9XjX">Josh</option>
          <option value="ErXwobaYiN019PkySvjV">Antoni</option>
        </select>
      </div>

      <label for="openai-key">OpenAI kulcs (opcionális, okosabb AI)</label>
      <input type="password" id="openai-key" autocomplete="off" placeholder="sk-… üresen is megy" />

      <label class="toggle-row" for="echo-mode">
        <input type="checkbox" id="echo-mode" />
        Vicces visszhang mód (mint Talking Tom)
      </label>

      <label class="toggle-row" for="auto-listen">
        <input type="checkbox" id="auto-listen" checked />
        Válasz után újra hallgat
      </label>

      <p class="hint" id="mic-help">
        Mikrofon: Chrome vagy Edge ajánlott, HTTPS-en (GitHub Pages).
        Ha az előnézetben (htmlpreview) nem megy, nyisd meg a saját Pages URL-t.
        Engedély: címsor 🔒 → Mikrofon → Engedélyezés.
      </p>

      <button type="button" id="btn-close-settings" class="primary-btn">Kész</button>
    </aside>

    <main class="stage">
      <div class="room" aria-hidden="true"></div>

      <div id="speech-bubble" class="speech-bubble hidden" role="status" aria-live="polite">
        <p id="bubble-text"></p>
      </div>

      <button type="button" id="character-hitbox" class="character-wrap" aria-label="Koppints Divire">
        <svg id="character" class="character state-idle" viewBox="0 0 280 360" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f07a45" />
              <stop offset="55%" stop-color="#e85d2c" />
              <stop offset="100%" stop-color="#c43c1a" />
            </linearGradient>
            <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff8f0" />
              <stop offset="100%" stop-color="#ffe8d2" />
            </linearGradient>
            <linearGradient id="tailGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#c43c1a" />
              <stop offset="100%" stop-color="#f07a45" />
            </linearGradient>
          </defs>

          <!-- shadow -->
          <ellipse class="shadow" cx="140" cy="340" rx="72" ry="12" fill="rgba(40,30,20,0.18)" />

          <!-- ringed tail (red panda signature) -->
          <g class="tail">
            <path d="M200 250 Q250 220 255 160 Q258 120 240 95" fill="none" stroke="url(#tailGrad)" stroke-width="28" stroke-linecap="round" />
            <path d="M200 250 Q250 220 255 160 Q258 120 240 95" fill="none" stroke="#fff3e0" stroke-width="28" stroke-linecap="round" stroke-dasharray="0 18 14 18 14 18 14 18 14 200" opacity="0.85" />
          </g>

          <!-- body -->
          <g class="body">
            <ellipse cx="140" cy="235" rx="72" ry="82" fill="url(#fur)" />
            <ellipse cx="140" cy="245" rx="44" ry="52" fill="url(#belly)" />

            <!-- arms -->
            <g class="arm arm-left">
              <ellipse cx="68" cy="225" rx="20" ry="34" fill="#e85d2c" transform="rotate(-16 68 225)" />
              <ellipse cx="54" cy="252" rx="15" ry="13" fill="#3d2b1f" />
            </g>
            <g class="arm arm-right">
              <ellipse cx="212" cy="225" rx="20" ry="34" fill="#e85d2c" transform="rotate(16 212 225)" />
              <ellipse cx="226" cy="252" rx="15" ry="13" fill="#3d2b1f" />
            </g>

            <!-- legs / dark socks -->
            <ellipse cx="112" cy="310" rx="22" ry="20" fill="#3d2b1f" />
            <ellipse cx="168" cy="310" rx="22" ry="20" fill="#3d2b1f" />
            <ellipse cx="112" cy="292" rx="18" ry="14" fill="#c43c1a" />
            <ellipse cx="168" cy="292" rx="18" ry="14" fill="#c43c1a" />
          </g>

          <!-- head -->
          <g class="head">
            <ellipse cx="140" cy="120" rx="84" ry="76" fill="url(#fur)" />

            <!-- round ears -->
            <g class="ear ear-left">
              <ellipse cx="68" cy="58" rx="28" ry="26" fill="#e85d2c" />
              <ellipse cx="70" cy="60" rx="14" ry="13" fill="#fff3e0" />
            </g>
            <g class="ear ear-right">
              <ellipse cx="212" cy="58" rx="28" ry="26" fill="#e85d2c" />
              <ellipse cx="210" cy="60" rx="14" ry="13" fill="#fff3e0" />
            </g>

            <!-- white face mask -->
            <ellipse cx="140" cy="128" rx="58" ry="48" fill="#fff8f0" />
            <!-- tear-drop cheek patches -->
            <path d="M78 118 Q70 145 95 155 Q100 130 90 115 Z" fill="#e85d2c" opacity="0.95" />
            <path d="M202 118 Q210 145 185 155 Q180 130 190 115 Z" fill="#e85d2c" opacity="0.95" />

            <!-- muzzle -->
            <ellipse cx="140" cy="148" rx="28" ry="22" fill="#ffffff" />
            <ellipse class="nose" cx="140" cy="138" rx="11" ry="8" fill="#2b2d42" />

            <!-- eyes -->
            <g class="eyes">
              <g class="eye eye-left">
                <ellipse cx="112" cy="112" rx="15" ry="17" fill="#fff" />
                <circle class="pupil" cx="114" cy="114" r="7.5" fill="#1d3557" />
                <circle cx="117" cy="110" r="2.5" fill="#fff" />
              </g>
              <g class="eye eye-right">
                <ellipse cx="168" cy="112" rx="15" ry="17" fill="#fff" />
                <circle class="pupil" cx="166" cy="114" r="7.5" fill="#1d3557" />
                <circle cx="169" cy="110" r="2.5" fill="#fff" />
              </g>
              <rect class="blink-lid lid-left" x="97" y="102" width="30" height="20" rx="10" fill="url(#fur)" opacity="0" />
              <rect class="blink-lid lid-right" x="153" y="102" width="30" height="20" rx="10" fill="url(#fur)" opacity="0" />
            </g>

            <!-- mouth — JS lip-sync morph -->
            <g class="mouth">
              <path class="mouth-closed" d="M124 162 Q140 170 156 162" fill="none" stroke="#2b2d42" stroke-width="3.5" stroke-linecap="round" />
              <ellipse class="mouth-open" cx="140" cy="168" rx="10" ry="3" fill="#2b2d42" opacity="0" />
              <ellipse class="mouth-tongue" cx="140" cy="174" rx="7" ry="4" fill="#e63946" opacity="0" />
            </g>
          </g>
        </svg>
        <span class="tap-hint">Koppints rám!</span>
      </button>

      <p id="status-line" class="status-line">Nyomd meg a mikrofont, és beszélj Divihez</p>
    </main>

    <section class="chat-dock">
      <div id="chat-log" class="chat-log" aria-live="polite"></div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <button type="button" id="btn-mic" class="mic-btn" aria-label="Beszélj">
          <span class="mic-icon">🎤</span>
          <span class="mic-wave" aria-hidden="true"></span>
        </button>
        <input id="user-input" type="text" maxlength="400" placeholder="Írd ide, vagy beszélj…" />
        <button type="submit" id="btn-send" class="send-btn" aria-label="Küldés">➤</button>
      </form>

      <div class="quick-actions">
        <button type="button" class="chip" data-prompt="Mondj egy viccet!">Vicc!</button>
        <button type="button" class="chip" data-prompt="Ki a kedvenc mesefigurád?">Kedvenced?</button>
        <button type="button" class="chip" data-prompt="Tegyél fel egy kérdést!">Kérdezz</button>
        <button type="button" class="chip" data-action="reset">Új beszélgetés</button>
      </div>
    </section>
  </div>

  <script src="brain.js"></script>
  <script src="character.js"></script>
  <script src="app.js"></script>
</body>
</html>
